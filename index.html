/* tokens/fonts.css */

@import url("https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Karla:wght@400;500;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap");

/* tokens/colors.css */
:root {
  /* Base ramp — warm near-blacks, the room the site lives in */
  --ink-900: #1A1512;
  --ink-800: #2A221C;
  --ink-700: #3B2E24;

  /* Media wells — the flat colour standing in for video and photography */
  --well-video: #123244;
  --well-clip: #1E3A4A;

  /* Accents */
  --orange-500: #FF7A2F;
  --cyan-400: #2FC2E8;

  /* Light */
  --cream-100: #F7F2EA;

  /* ---- Semantic ---- */
  --bg-page: var(--ink-900);
  --bg-raised: var(--ink-800);
  /* The cool counterpart to --bg-raised — same job, colder room */
  --bg-raised-cool: var(--well-video);
  --bg-well: var(--ink-700);
  --bg-inverse: var(--cream-100);
  --bg-accent-warm: var(--orange-500);
  --bg-accent-cool: var(--cyan-400);

  --text-primary: var(--cream-100);
  --text-muted: rgba(247, 242, 234, 0.8);
  --text-quiet: rgba(247, 242, 234, 0.6);
  --text-on-accent: var(--ink-900);
  --text-on-inverse: var(--ink-900);
  --text-label-cool: var(--cyan-400);
  --text-label-warm: var(--orange-500);

  --border-strong: var(--cream-100);
  --border-on-light: var(--ink-900);
  --border-hairline: rgba(247, 242, 234, 0.12);
}

/* tokens/typography.css */
:root {
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Karla", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;
  /* Pull quotes only — a review, never body copy or headlines */
  --font-quote: "Instrument Serif", Georgia, serif;

  --weight-display: 800;
  --weight-bold: 700;
  --weight-regular: 400;

  /* Display — always uppercase, always negative tracking */
  --display-xl-size: 88px;   --display-xl-lh: 0.9;   --display-xl-track: -0.035em;
  --display-l-size: 46px;    --display-l-lh: 1;      --display-l-track: -0.03em;
  --display-m-size: 40px;    --display-m-lh: 0.98;   --display-m-track: -0.03em;
  --display-s-size: 34px;    --display-s-lh: 1;      --display-s-track: -0.03em;
  --display-xs-size: 24px;   --display-xs-lh: 1.1;   --display-xs-track: -0.01em;
  --display-nav-size: 16px;  --display-nav-track: -0.01em;

  /* Body — Karla, sentence case, never uppercase */
  --body-l-size: 16px;  --body-l-lh: 1.5;
  --body-m-size: 15px;  --body-m-lh: 1.55;
  --body-s-size: 14px;  --body-s-lh: 1.5;

  /* Mono — labels, captions, metadata. Uppercase, wide tracking */
  --mono-l-size: 12px;  --mono-l-track: 0.16em;
  --mono-m-size: 12px;  --mono-m-track: 0.1em;
  --mono-s-size: 11px;  --mono-s-track: 0.08em;

  /* Pull quote */
  --quote-size: 34px;  --quote-lh: 1.22;  --quote-track: -0.01em;

  /* Action labels — uppercase Karla bold */
  --action-size: 14px;  --action-track: 0.06em;
}

/* tokens/spacing.css */
:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 14px;
  --space-5: 18px;
  --space-6: 22px;
  --space-7: 26px;

  --section-y: 90px;       /* standard vertical padding */

  /* Media wells */
  --hero-h: 580px;
  --photo-h: 460px;
  --clip-h: 400px;

  --measure-display: 22ch;
  --measure-body: 44ch;

/* tokens/borders.css */
:root {
  /* Nothing is rounded. Ever. */
  --radius: 0;

  --border-rule: 3px;       /* the orange rule under the press photo */

  --ease: cubic-bezier(0.2, 0, 0, 1);
  --dur-fast: 120ms;
  --dur: 180ms;
}

        textTransform: "uppercase",
        color: colors[tone],

}

function Button({ variant = "warm", size = "md", href, disabled, style, children, ...rest }) {
  const Tag = href ? "a" : "button";
  return (
    <Tag
      href={href}

      style={{
        ...btnBase,

function MediaWell({ caption, height = 580, background = "var(--well-video)", src, video, poster, play = true, playAt = "30%", rule = false, position = "center", sound = false, startUnmuted = false, lang = "da", ratio, children, style }) {
  const hasMedia = Boolean(src || video);
  const ref = React.useRef(null);
  const [muted, setMuted] = React.useState(!startUnmuted);
  const [progress, setProgress] = React.useState(0);
  const [playing, setPlaying] = React.useState(true);
  const soundLabel = lang === "da" ? (muted ? "Lyd til" : "Lyd fra") : (muted ? "Sound on" : "Sound off");
  React.useEffect(() => {
    const el = ref.current;
    if (!el || !video) return;
    const io = new IntersectionObserver(
      ([e]) => {
        if (e.isIntersecting) {
          el.play();
        } else {
          if (!el.muted) { el.muted = true; setMuted(true); }
          el.pause();
          el.currentTime = 0;
          setProgress(0);
        }
      },
      { threshold: 0.25 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, [video]);
  React.useEffect(() => {
    const el = ref.current;
    if (!el || !video || !startUnmuted) return;
    el.muted = false;
    setMuted(false);
    const p = el.play();
    if (p && p.catch) p.catch(() => { el.muted = true; setMuted(true); el.play(); });
  }, [video, startUnmuted]);
  const toggle = () => {
    const el = ref.current;
    if (!el) return;
    el.muted = !el.muted;
    setMuted(el.muted);
    if (!el.muted) el.play();
  };
  return (
    <div style={{ height: ratio ? "auto" : height, aspectRatio: ratio, background, position: "relative", display: "flex", alignItems: "flex-end", overflow: "hidden", ...style }}>
      {video ? (
        <video ref={ref} src={video} poster={poster} autoPlay muted loop playsInline onTimeUpdate={(e) => { const v = e.currentTarget; if (v.duration) setProgress(v.currentTime / v.duration); }} onPlay={() => setPlaying(true)} onPause={() => setPlaying(false)} style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }} />
      ) : src ? (
        <img src={src} alt="" style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover", objectPosition: position }} />
      ) : null}
      {hasMedia ? <div style={{ position: "absolute", inset: 0, background: "linear-gradient(to top, rgba(26,21,18,0.85) 0%, rgba(26,21,18,0.25) 45%, rgba(26,21,18,0.1) 100%)" }} /> : null}
      {rule ? <div style={{ position: "absolute", inset: 0, borderBottom: "3px solid var(--orange-500)" }} /> : null}
      {video ? (
        <div style={{ position: "absolute", left: 0, right: 0, bottom: 0, height: 2, background: "rgba(247,242,234,0.18)", zIndex: 3 }}>
          <div style={{ height: "100%", width: (progress * 100) + "%", background: "var(--orange-500)" }} />
        </div>
      ) : null}
      {caption ? (
        <MonoLabel tone="plain" style={{ position: "absolute", left: "var(--gutter)", top: 22, opacity: 0.8 }}>{caption}</MonoLabel>
      ) : null}
      {play && !video ? (
        <div style={{ position: "absolute", left: 0, right: 0, top: playAt, display: "flex", justifyContent: "center" }}>
          <div style={{ width: 0, height: 0, borderLeft: "32px solid var(--orange-500)", borderTop: "20px solid transparent", borderBottom: "20px solid transparent" }} />
        </div>
      ) : null}
      {video ? (
        <div style={{ position: "absolute", right: "var(--gutter)", bottom: 16, display: "flex", gap: 6, zIndex: 3 }}>
          <button
            onClick={() => { const el = ref.current; if (!el) return; if (el.paused) el.play(); else el.pause(); }}
            aria-label={playing ? (lang === "da" ? "Pause" : "Pause") : (lang === "da" ? "Afspil" : "Play")}
            title={playing ? "Pause" : (lang === "da" ? "Afspil" : "Play")}
            style={{ background: "rgba(26,21,18,0.28)", backdropFilter: "blur(6px)", WebkitBackdropFilter: "blur(6px)", border: "1px solid rgba(247,242,234,0.28)", padding: "5px 7px", color: "var(--cream-100)", opacity: 0.7, cursor: "pointer", display: "flex", alignItems: "center", transition: "opacity var(--dur) var(--ease)" }}
          >
            {playing ? (
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></svg>
            ) : (
